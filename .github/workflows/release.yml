name: Release

# 打 tag（v1.2.3）即自动出包并发布 Release；也可以在 Actions 页手动跑：
# platforms=all + quick=false + 填好 tag，等价于一次正式发版。
on:
  push:
    tags: ["v*"]
  # 手动跑：默认 quick + 单平台，验证改动用；选 all 且关掉 quick 就是发版那套全量构建。
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建范围：check 只查编译不出包；all 四平台；选单个只出那一个"
        type: choice
        default: all
        options: [all, android-arm64, android, linux, windows, macos, ios, check]
      quick:
        description: "quick 编译：thin LTO + 4 个 codegen 单元，快一倍，体积大几 MB"
        type: boolean
        default: true
      tag:
        description: "发版用：填 tag（如 v1.2.4+hg.1），配合 platforms=all 构建完直接发 Release；留空则只出产物"
        type: string
        default: ""

concurrency:
  # 同一 ref 上任何新 run（重复 dispatch / 重跑）都会取消在跑的旧 run，
  # 避免「两个一样的 runner 同时跑」；不同分支/标签互不干扰。
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # ================= Windows：NSIS 安装包 + 便携包 =================
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # 版本号 + Android versionCode 一起写（Tauri 自己会忽略 +hg.N 后缀）
          node scripts/set-version.mjs "$V"
          CODE="$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V  versionCode=$CODE"

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/hghubx.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhubX.exe"
          Compress-Archive -Path "artifacts/HGhubX.exe" -DestinationPath "artifacts/HGhubX_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhubX.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  # ================= Android：按 ABI 分包 + 签名 =================
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || startsWith(inputs.platforms, 'android') }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # 版本号 + Android versionCode 一起写（Tauri 自己会忽略 +hg.N 后缀）
          node scripts/set-version.mjs "$V"
          CODE="$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V  versionCode=$CODE"

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: |
          # quick / android-arm64 只出 arm64：真机验证用不到 v7a 和 x86_64，省三分之二时间
          if [ "${{ inputs.quick }}" = "true" ] || [ "${{ inputs.platforms }}" = "android-arm64" ]; then
            TARGETS="aarch64"
          else
            TARGETS="aarch64 armv7 x86_64"
          fi
          echo "targets: $TARGETS"
          pnpm tauri android build --apk --split-per-abi --target $TARGETS

      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名"; exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhubX_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          # 打一下实际写进 APK 的 versionCode，升级链对不对看这行
          AAPT2="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)"
          for a in artifacts/*.apk; do "$AAPT2" dump badging "$a" | grep -m1 "^package:"; done
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  # ================= macOS：Universal（Apple Silicon + Intel）dmg =================
  macos:
    name: macOS (universal dmg)
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # 版本号 + Android versionCode 一起写（Tauri 自己会忽略 +hg.N 后缀）
          node scripts/set-version.mjs "$V"
          CODE="$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V  versionCode=$CODE"

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: macos

      - run: pnpm install --frozen-lockfile

      # 打包目标（app + dmg）取自 src-tauri/tauri.macos.conf.json；未配置开发者证书，产物为 ad-hoc 签名
      - name: 构建（Universal dmg）
        run: |
          # quick 只编 arm64：universal 要交叉编两遍，时间翻倍
          if [ "${{ inputs.quick }}" = "true" ]; then
            pnpm tauri build --target aarch64-apple-darwin
          else
            pnpm tauri build --target universal-apple-darwin
          fi

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DIR=universal-apple-darwin
          SUFFIX=universal
          if [ "${{ inputs.quick }}" = "true" ]; then DIR=aarch64-apple-darwin; SUFFIX=arm64; fi
          cp "src-tauri/target/$DIR/release/bundle/dmg/"*.dmg \
             "artifacts/HGhubX_${{ steps.ver.outputs.version }}_${SUFFIX}.dmg"
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'ios' }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionName=$V"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: pnpm install --frozen-lockfile

      # 跟上游一致：不在 pbxproj 里绕开 xcode-script，而是让 tauri ios build 的
      # options server 活着，由 Xcode 用 release 配置跑 Build Rust Code。
      - name: 生成 iOS 工程（带横竖屏 + ATS）
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done

      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error

  # ================= Linux：deb =================
  linux:
    name: Linux (deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # 版本号 + Android versionCode 一起写（Tauri 自己会忽略 +hg.N 后缀）
          node scripts/set-version.mjs "$V"
          CODE="$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V  versionCode=$CODE"

      # Tauri 2 在 Linux 上依赖 webkit2gtk-4.1；22.04 的 jammy-updates 已提供
      - name: Point apt at Tsinghua mirror
        run: |
          set -euo pipefail
          # GitHub 22.04 runner 的实际源在 file: mirrorlist 里间接指向这里
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          # ubuntu-22.04: classic one-line sources.list
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/sources.list
          fi
          # ubuntu-24.04: deb822 .sources
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          grep -Rhn -E 'azure\.archive|archive\.ubuntu|security\.ubuntu|mirrors\.tuna' \
            /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ 2>/dev/null | head -20 || true

      - name: 安装系统依赖
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: linux

      - run: pnpm install --frozen-lockfile

      # 打包目标取自 src-tauri/tauri.linux.conf.json
      - name: 构建（deb）
        run: pnpm tauri build

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhubX_${{ steps.ver.outputs.version }}_amd64.deb"
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  # ================= 只查编译：不出包，最快拿到「过 / 不过」 =================
  check:
    name: 编译检查（tsc + cargo check + 单测）
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms == 'check' }}
    steps:
      - uses: actions/checkout@v7

      - name: 版本号对齐
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"

      - name: Point apt at Tsinghua mirror
        run: |
          set -euo pipefail
          # GitHub 22.04 runner 的实际源在 file: mirrorlist 里间接指向这里
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          # ubuntu-22.04: classic one-line sources.list
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/sources.list
          fi
          # ubuntu-24.04: deb822 .sources
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          grep -Rhn -E 'azure\.archive|archive\.ubuntu|security\.ubuntu|mirrors\.tuna' \
            /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ 2>/dev/null | head -20 || true

      - name: 安装系统依赖
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: check

      - run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        run: npx tsc --noEmit -p tsconfig.json

      - name: cargo check（含测试目标）
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib

  # ================= 发布 =================
  release:
    name: Publish GitHub Release
    needs: [windows, android, macos, linux, ios]
    # always()：iOS 失败时不能把整包卡住，但成功时要等它的 ipa 一起发
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - name: 取版本说明
        id: notes
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          F="docs/release-notes/${TAG}.md"
          if [ -f "$F" ]; then
            echo "body_path=$F" >> "$GITHUB_OUTPUT"
            echo "使用 $F"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "没有 $F，回退自动生成的说明"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true