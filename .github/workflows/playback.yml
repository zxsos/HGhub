name: Playback diagnostics

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Comma-separated checks (seek,legacy,stall,lifecycle,mms)
        default: seek,legacy,stall,lifecycle,mms
        required: true

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install local media generator and headless browser
        run: |
                - name: Point apt at Tsinghua mirror
        run: |
          set -euo pipefail
          sudo sed -i -E \
            -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          grep -Rhn -E 'URIs|archive|tuna' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt || true

sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y ffmpeg
          pnpm exec playwright-core install --with-deps chromium
      - name: Run playback checks and collect diagnostics
        env:
          PLAYBACK_SCENARIOS: ${{ inputs.scenarios }}
        run: pnpm test:playback --scenarios "$PLAYBACK_SCENARIOS" --output test-results/playback-ci
      - name: Upload diagnostics even when a check fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playback-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
