name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify system browser
        run: |
          set -euo pipefail
          browser="$BROWSER_EXECUTABLE"
          if [ ! -x "$browser" ]; then
            browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          fi
          if [ -z "$browser" ] || [ ! -x "$browser" ]; then
            echo "No usable system browser; using Playwright Chromium from cache"
            pnpm exec playwright-core install chromium
            browser="$(node -e 'const { chromium } = require("playwright-core"); console.log(chromium.executablePath())')"
          fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Restore playback fixture
        id: playback_fixture
        uses: actions/cache@v4
        with:
          path: .cache/playback-media
          key: playback-media-${{ runner.os }}-${{ hashFiles('scripts/test-playback.mjs') }}
          restore-keys: playback-media-${{ runner.os }}-

      - name: Prepare playback media
        run: |
          set -euo pipefail
          if [ -s .cache/playback-media/.fixture-key ] && [ -s .cache/playback-media/list.m3u8 ]; then
            echo "Playback fixture cache hit"
          else
            echo "Playback fixture cache miss; fetching static ffmpeg"
            mkdir -p .cache/playback-media
            curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/ffmpeg" \
              https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64
            chmod +x "$RUNNER_TEMP/ffmpeg"
            echo "FFMPEG_PATH=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
            "$RUNNER_TEMP/ffmpeg" -version | head -1
          fi

      - name: Typecheck and build
        run: pnpm build

      - name: Channel pagination regression
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:channel-pagination'] ? 0 : 1)"; then
            pnpm test:channel-pagination
          else
            echo "test:channel-pagination not present on this branch yet; skipped until PR #48 lands"
          fi

      - name: Brand neutrality
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:brand-neutral'] ? 0 : 1)"; then
            pnpm test:brand-neutral
          else
            echo "test:brand-neutral not present on this branch yet; skipped until the branding PR registers it"
          fi

      - name: API loading states
        run: pnpm test:api-loading

      - name: Mobile layout
        run: pnpm test:mobile-layout

      - name: Diagnostic copy
        run: pnpm test:diagnostic-copy

      - name: Playback diagnostics
        run: pnpm test:playback --media-dir .cache/playback-media --browser-executable "$BROWSER_EXECUTABLE"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-v1
          restore-keys: apt-${{ runner.os }}-

      - name: Point apt at Tsinghua mirror
        run: |
          set -euo pipefail
          sudo sed -i -E \
            -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E \
              -e 's#https?://(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
          fi
          echo "arch=$(dpkg --print-architecture)"
          grep -Rhn -E 'URIs|archive|tuna' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt || true

      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives/" install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives" || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo unit tests
        working-directory: src-tauri
        run: cargo test --lib
